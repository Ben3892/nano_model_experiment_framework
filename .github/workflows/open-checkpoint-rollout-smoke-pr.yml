name: Open A800 PR as GitHub Actions bot
on:
  push:
    branches:
      - codex/actions-checkpoint-rollout-smoke
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: open-checkpoint-rollout-smoke-pr
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish reviewed A800 tree and open PR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          repository = "Ben3892/nano_model_experiment_framework"
          base_sha = "471dc2ed60fcef88a980f4795afdf4d09031120e"
          tree_sha = "4b0d61ffb3a4e4bd44b0d227b70ad58e072450fd"
          branch = "codex/checkpoint-rollout-smoke"
          bot = "github-actions[bot]"
          title = "Validate Megatron checkpoint manifests and smoke-test single-rank rollout"
          body = "## 改动\n\n- 按锁定的 Megatron 版本校验 metadata.json 的分片与公共后端及版本，将格式清单纳入 RSI checkpoint 摘要。\n- 增加单卡 rollout smoke 入口。分别使用 DP1 或 DP2 的已有产物，固定 iteration 和 seed，复用原生 worker 生成一个样本，保留加载日志、请求、响应和摘要。\n- README 提供两条目标机验收命令。测试覆盖格式错误、tracker 漂移和生成未遇到 EOS 的情况。\n\n## 验证\n\n16 个 CPU 单测通过，真实索引写入器的四组 prepare 通过，Bash 语法检查通过。新增 rollout 测试使用模拟子进程。真实 A800 BF16 加载及 DP2 产物在单卡上的采样仍待目标机验收。"
          root = "/repos/" + repository
          if os.environ["GITHUB_REPOSITORY"] != repository:
              raise SystemExit("Unexpected workflow repository")
          token = os.environ["GH_TOKEN"]
          
          
          class GitHubError(RuntimeError):
              def __init__(self, status, message):
                  self.status = status
                  super().__init__(f"GitHub HTTP {status}: {message}")
          
          
          def api(method, path, payload=None):
              req = Request(
                  "https://api.github.com" + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "User-Agent": "a800-actions-publisher",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise GitHubError(error.code, error.read().decode(errors="replace").replace(token, "[redacted]")) from None
          
          
          def branch_sha():
              try:
                  return api("GET", root + "/git/ref/heads/" + branch)["object"]["sha"]
              except GitHubError as error:
                  if error.status == 404:
                      return None
                  raise
          
          
          def check_commit(commit):
              if commit["tree"]["sha"] != tree_sha or [p["sha"] for p in commit["parents"]] != [base_sha]:
                  raise RuntimeError("Commit does not match the reviewed A800 tree")
              if not commit["author"]["email"].endswith(bot + "@users.noreply.github.com"):
                  raise RuntimeError("Unexpected author for A800 commit")
          
          
          def matching_pr(sha):
              q = urlencode({"head": repository.split("/")[0] + ":" + branch, "base": "main", "state": "open"})
              for pr in api("GET", root + "/pulls?" + q):
                  if (pr["user"]["login"], pr["head"]["sha"]) != (bot, sha):
                      raise RuntimeError("The branch already has a PR with unexpected content or author")
                  return pr
              return None
          
          
          sha = branch_sha()
          if sha is None:
              commit = api("POST", root + "/git/commits", {"message": title, "tree": tree_sha, "parents": [base_sha]})
              check_commit(commit)
              sha = commit["sha"]
              try:
                  api("POST", root + "/git/refs", {"ref": "refs/heads/" + branch, "sha": sha})
              except GitHubError as error:
                  if error.status != 422:
                      raise
                  sha = branch_sha()
                  if sha is None:
                      raise
                  check_commit(api("GET", root + "/git/commits/" + sha))
          else:
              check_commit(api("GET", root + "/git/commits/" + sha))
          
          pr = matching_pr(sha)
          if pr is None:
              try:
                  pr = api("POST", root + "/pulls", {"title": title, "body": body, "head": branch, "base": "main"})
              except GitHubError as error:
                  if error.status != 422:
                      raise
                  pr = matching_pr(sha)
                  if pr is None:
                      raise
          if (pr["user"]["login"], pr["head"]["sha"]) != (bot, sha):
              raise RuntimeError("GitHub returned an unexpected PR author or head")
          print(pr["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Opened [{title}]({pr['html_url']}) as `{bot}`.\n")
          PY
