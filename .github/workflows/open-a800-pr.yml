name: Open A800 PR as GitHub Actions bot
on:
  push:
    branches:
      - codex/actions-a800-pr
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: open-a800-pr
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish reviewed A800 tree and open PR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          repository = "Ben3892/nano_model_experiment_framework"
          base_sha = "29ba1b031860fd6171a18df98e6ce63caac14154"
          tree_sha = "09d734e16b7b6932d2416382ca7f6f327d8e20f6"
          branch = "codex/a800-megatron-rsi"
          bot = "github-actions[bot]"
          title = "Add A800 smoke tests and native Megatron RSI rollout"
          body = """## Changes
          
          - Add one-GPU and two-GPU A800 smoke tests with checkpoint and SFT warm-start checks.
          - Add native Megatron rollout for RSI from a pinned distributed checkpoint.
          - Document how to run the A800 and RSI commands.
          
          ## Validation
          
          14 local CPU tests passed. The pinned upstream parser, MMAP reader, and serial JSON-SFT reader were checked. BF16 training, distributed checkpoint I/O, and GPU rollout await an A800 run.
          """
          root = "/repos/" + repository
          if os.environ["GITHUB_REPOSITORY"] != repository:
              raise SystemExit("Unexpected workflow repository")
          token = os.environ["GH_TOKEN"]
          
          
          class GitHubError(RuntimeError):
              def __init__(self, status, message):
                  self.status = status
                  super().__init__(f"GitHub HTTP {status}: {message}")
          
          
          def api(method, path, payload=None):
              req = Request(
                  "https://api.github.com" + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "User-Agent": "a800-actions-publisher",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise GitHubError(error.code, error.read().decode(errors="replace").replace(token, "[redacted]")) from None
          
          
          def branch_sha():
              try:
                  return api("GET", root + "/git/ref/heads/" + branch)["object"]["sha"]
              except GitHubError as error:
                  if error.status == 404:
                      return None
                  raise
          
          
          def check_commit(commit):
              if commit["tree"]["sha"] != tree_sha or [p["sha"] for p in commit["parents"]] != [base_sha]:
                  raise RuntimeError("Commit does not match the reviewed A800 tree")
              if not commit["author"]["email"].endswith(bot + "@users.noreply.github.com"):
                  raise RuntimeError("Unexpected author for A800 commit")
          
          
          def matching_pr(sha):
              q = urlencode({"head": repository.split("/")[0] + ":" + branch, "base": "main", "state": "open"})
              for pr in api("GET", root + "/pulls?" + q):
                  if (pr["user"]["login"], pr["head"]["sha"]) != (bot, sha):
                      raise RuntimeError("The branch already has a PR with unexpected content or author")
                  return pr
              return None
          
          
          sha = branch_sha()
          if sha is None:
              commit = api("POST", root + "/git/commits", {"message": title, "tree": tree_sha, "parents": [base_sha]})
              check_commit(commit)
              sha = commit["sha"]
              try:
                  api("POST", root + "/git/refs", {"ref": "refs/heads/" + branch, "sha": sha})
              except GitHubError as error:
                  if error.status != 422:
                      raise
                  sha = branch_sha()
                  if sha is None:
                      raise
                  check_commit(api("GET", root + "/git/commits/" + sha))
          else:
              check_commit(api("GET", root + "/git/commits/" + sha))
          
          pr = matching_pr(sha)
          if pr is None:
              try:
                  pr = api("POST", root + "/pulls", {"title": title, "body": body, "head": branch, "base": "main"})
              except GitHubError as error:
                  if error.status != 422:
                      raise
                  pr = matching_pr(sha)
                  if pr is None:
                      raise
          if (pr["user"]["login"], pr["head"]["sha"]) != (bot, sha):
              raise RuntimeError("GitHub returned an unexpected PR author or head")
          print(pr["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Opened [{title}]({pr['html_url']}) as `{bot}`.\n")
          PY
